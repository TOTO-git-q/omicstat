# omicstat-reference on GT103: the omicstat_reference fork (app/, base medstat-reference v2 07fdebd).
# Same container invariants as the base. Lives in ~/omic-infra-reference/release/; the build context
# (../context, staged from app/) and the persistent data (../runtime/data, ../runtime/logs) are siblings.
name: omicstat-reference
services:
  omicstat-reference:
    image: omicstat-reference:20260929-fork1
    build:
      context: ../context
      dockerfile: Dockerfile
    container_name: omicstat-reference
    init: true
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    environment:
      TZ: Asia/Shanghai
      OMICSTAT_REFERENCE_DATA: /data
      OMICSTAT_REFERENCE_LOGS: /logs
      OMICSTAT_REFERENCE_DEPLOYMENT: gt103-docker
      OMICSTAT_REFERENCE_SCHEDULER: "omicstat_reference on GT103: resident Docker worker; every three hours; literature requests first; daily ten screened (omics journal whitelist + Methods signal) in Asia/Shanghai."
    volumes:
      - ../runtime/data:/data
      - ../runtime/logs:/logs
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=33554432,mode=1777
    healthcheck:
      test: [CMD, python, /app/worker.py, --health]
      interval: 60s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
